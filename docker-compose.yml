services:
  veritas-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: veritas-sandbox:local
    container_name: veritas-sandbox-builder
    restart: "no"
    command: ["python", "--version"]

  veritas:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritas:latest
    container_name: veritas-app
    depends_on:
      - veritas-sandbox
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VERITAS_DOCKER_TESTS=1
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - VERITAS_OLLAMA_BASE_URL=${VERITAS_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - VERITAS_API_KEY=${VERITAS_API_KEY:-}
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    entrypoint: ["veritas"]
    command: ["--help"]

  veritas-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritas:latest
    container_name: veritas-test-runner
    depends_on:
      - veritas-sandbox
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VERITAS_DOCKER_TESTS=1
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - VERITAS_OLLAMA_BASE_URL=${VERITAS_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
    entrypoint: ["pytest"]
    command: ["-ra"]

  veritas-reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritas:latest
    container_name: veritas-reproduce-runner
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["python"]
    command: ["replication/scripts/reproduce_all.py"]

  veritas-bash:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritas:latest
    container_name: veritas-interactive
    depends_on:
      - veritas-sandbox
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VERITAS_DOCKER_TESTS=1
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - VERITAS_OLLAMA_BASE_URL=${VERITAS_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - VERITAS_API_KEY=${VERITAS_API_KEY:-}
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]
