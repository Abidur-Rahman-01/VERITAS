<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#ffffff; font-family:Arial, sans-serif;">
  <text x="400" y="35" font-size="20" font-weight="bold" fill="#1f4e79" text-anchor="middle">NVIDIA GeForce RTX 5080: Model Scaling &amp; Latency</text>
  <text x="400" y="60" font-size="13" fill="#595959" text-anchor="middle">Local Ollama Inference: Memory Footprint (GB) vs. Structuring Latency (ms)</text>
  
  <line x1="120" y1="340" x2="680" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="340" stroke="#333" stroke-width="2"/>
  
  <line x1="120" y1="280" x2="680" y2="280" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="120" y1="220" x2="680" y2="220" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="120" y1="160" x2="680" y2="160" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="120" y1="100" x2="680" y2="100" stroke="#e0e0e0" stroke-dasharray="4"/>
  
  <text x="105" y="345" font-size="12" fill="#666" text-anchor="end">0</text>
  <text x="105" y="285" font-size="12" fill="#666" text-anchor="end">4 GB / 2s</text>
  <text x="105" y="225" font-size="12" fill="#666" text-anchor="end">8 GB / 4s</text>
  <text x="105" y="165" font-size="12" fill="#666" text-anchor="end">12 GB / 6s</text>
  <text x="105" y="105" font-size="12" fill="#666" text-anchor="end">16 GB / 8s</text>
  
  <!-- Llama-3.2 3B: VRAM 2.0GB (30px), Latency 3.16s (94.8px) -->
  <rect x="180" y="310" width="45" height="30" fill="#5c6bc0" rx="3"/>
  <rect x="235" y="245.2" width="45" height="94.8" fill="#ffa726" rx="3"/>
  <text x="230" y="365" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Llama-3.2 3B</text>
  <text x="202" y="302" font-size="11" fill="#3949ab" text-anchor="middle">2.0 GB</text>
  <text x="257" y="237" font-size="11" fill="#ef6c00" text-anchor="middle">3.17s</text>
  
  <!-- Qwen2.5-Coder 7B: VRAM 4.7GB (70.5px), Latency 3.97s (119.1px) -->
  <rect x="340" y="269.5" width="45" height="70.5" fill="#5c6bc0" rx="3"/>
  <rect x="395" y="220.9" width="45" height="119.1" fill="#ffa726" rx="3"/>
  <text x="390" y="365" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Qwen-Coder 7B</text>
  <text x="362" y="261" font-size="11" fill="#3949ab" text-anchor="middle">4.7 GB</text>
  <text x="417" y="212" font-size="11" fill="#ef6c00" text-anchor="middle">3.97s</text>
  
  <!-- Qwen2.5-Coder 14B: VRAM 9.0GB (135px), Latency 6.47s (194.1px) -->
  <rect x="500" y="205" width="45" height="135" fill="#5c6bc0" rx="3"/>
  <rect x="555" y="145.9" width="45" height="194.1" fill="#ffa726" rx="3"/>
  <text x="550" y="365" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">Qwen-Coder 14B</text>
  <text x="522" y="197" font-size="11" font-weight="bold" fill="#3949ab" text-anchor="middle">9.0 GB</text>
  <text x="577" y="137" font-size="11" font-weight="bold" fill="#ef6c00" text-anchor="middle">6.47s</text>
  
  <!-- Headroom callout -->
  <line x1="120" y1="175" x2="680" y2="175" stroke="#d32f2f" stroke-dasharray="6" stroke-width="2"/>
  <text x="670" y="168" font-size="11" font-weight="bold" fill="#d32f2f" text-anchor="end">Co-located Total: 11.0 GB (5.3 GB VRAM Headroom Remaining on RTX 5080)</text>
  
  <!-- Legend -->
  <rect x="230" y="415" width="18" height="12" fill="#5c6bc0" rx="2"/>
  <text x="255" y="426" font-size="12" fill="#444">VRAM Footprint (GB)</text>
  <rect x="450" y="415" width="18" height="12" fill="#ffa726" rx="2"/>
  <text x="475" y="426" font-size="12" fill="#444">End-to-End Generation Latency (Seconds)</text>
</svg>