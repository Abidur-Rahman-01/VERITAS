<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#ffffff; font-family:Arial, sans-serif;">
  <text x="400" y="35" font-size="20" font-weight="bold" fill="#1f4e79" text-anchor="middle">AgentDojo: Attack Success Rate (ASR) vs. Benign Utility</text>
  <text x="400" y="60" font-size="13" fill="#595959" text-anchor="middle">Indirect Prompt Injection Defense across Workspace, Slack, Banking &amp; Travel</text>
  
  <line x1="140" y1="340" x2="660" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="100" x2="140" y2="340" stroke="#333" stroke-width="2"/>
  
  <line x1="140" y1="280" x2="660" y2="280" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="140" y1="220" x2="660" y2="220" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="140" y1="160" x2="660" y2="160" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="140" y1="100" x2="660" y2="100" stroke="#e0e0e0" stroke-dasharray="4"/>
  
  <text x="125" y="345" font-size="12" fill="#666" text-anchor="end">0%</text>
  <text x="125" y="285" font-size="12" fill="#666" text-anchor="end">25%</text>
  <text x="125" y="225" font-size="12" fill="#666" text-anchor="end">50%</text>
  <text x="125" y="165" font-size="12" fill="#666" text-anchor="end">75%</text>
  <text x="125" y="105" font-size="12" fill="#666" text-anchor="end">100%</text>
  
  <!-- Group 1: Base LLM Agent -->
  <rect x="220" y="100" width="65" height="240" fill="#d32f2f" rx="3"/>
  <text x="252" y="92" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">100.0%</text>
  
  <rect x="300" y="100" width="65" height="240" fill="#388e3c" rx="3"/>
  <text x="332" y="92" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">100.0%</text>
  
  <text x="292" y="365" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Base LLM Agent</text>
  <text x="292" y="385" font-size="11" fill="#d32f2f" text-anchor="middle">(Compromised)</text>
  
  <!-- Group 2: VERITAS Sentinel -->
  <rect x="440" y="340" width="65" height="0" fill="#d32f2f" rx="3"/>
  <text x="472" y="332" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">0.0%</text>
  
  <rect x="520" y="100" width="65" height="240" fill="#388e3c" rx="3"/>
  <text x="552" y="92" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">100.0%</text>
  
  <text x="512" y="365" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">VERITAS Sentinel</text>
  <text x="512" y="385" font-size="11" fill="#2e7d32" text-anchor="middle">(Zero Injection Attack Success)</text>
  
  <!-- Legend -->
  <rect x="230" y="415" width="18" height="12" fill="#d32f2f" rx="2"/>
  <text x="255" y="426" font-size="12" fill="#444">Attack Success Rate (Lower is Better)</text>
  <rect x="470" y="415" width="18" height="12" fill="#388e3c" rx="2"/>
  <text x="495" y="426" font-size="12" fill="#444">Benign Utility Retention (Higher is Better)</text>
</svg>