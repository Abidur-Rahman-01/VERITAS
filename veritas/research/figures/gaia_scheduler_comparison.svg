<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#ffffff; font-family:Arial, sans-serif;">
  <text x="400" y="35" font-size="20" font-weight="bold" fill="#1f4e79" text-anchor="middle">GAIA-Text-103: Verification Rate &amp; Error Detection</text>
  <text x="400" y="60" font-size="13" fill="#595959" text-anchor="middle">Budget B = 0.24, 33 Total Reasoning Steps across 10 Tasks</text>
  
  <!-- Axis -->
  <line x1="100" y1="350" x2="720" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="350" stroke="#333" stroke-width="2"/>
  
  <!-- Grid lines -->
  <line x1="100" y1="290" x2="720" y2="290" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="100" y1="230" x2="720" y2="230" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="100" y1="170" x2="720" y2="170" stroke="#e0e0e0" stroke-dasharray="4"/>
  <line x1="100" y1="110" x2="720" y2="110" stroke="#e0e0e0" stroke-dasharray="4"/>
  
  <!-- Y Axis Labels -->
  <text x="85" y="355" font-size="12" fill="#666" text-anchor="end">0%</text>
  <text x="85" y="295" font-size="12" fill="#666" text-anchor="end">25%</text>
  <text x="85" y="235" font-size="12" fill="#666" text-anchor="end">50%</text>
  <text x="85" y="175" font-size="12" fill="#666" text-anchor="end">75%</text>
  <text x="85" y="115" font-size="12" fill="#666" text-anchor="end">100%</text>
  
  <!-- Bars: (never, error_x_impact, bavar_style, rc_vov) -->
  <!-- 1. never -->
  <rect x="150" y="350" width="45" height="0" fill="#9e9e9e"/>
  <rect x="200" y="350" width="45" height="0" fill="#ef5350"/>
  <text x="197" y="375" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">never</text>
  <text x="172" y="340" font-size="11" fill="#666" text-anchor="middle">0%</text>
  <text x="222" y="340" font-size="11" fill="#666" text-anchor="middle">0%</text>
  
  <!-- 2. error_x_impact -->
  <rect x="290" y="350" width="45" height="0" fill="#9e9e9e"/>
  <rect x="340" y="350" width="45" height="0" fill="#ef5350"/>
  <text x="337" y="375" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">error_x_impact</text>
  <text x="312" y="340" font-size="11" fill="#666" text-anchor="middle">0%</text>
  <text x="362" y="340" font-size="11" fill="#666" text-anchor="middle">0%</text>
  
  <!-- 3. bavar_style (Verified: 15.2% = 36.4px, Caught: 0%) -->
  <rect x="430" y="313.6" width="45" height="36.4" fill="#29b6f6" rx="3"/>
  <rect x="480" y="350" width="45" height="0" fill="#ef5350"/>
  <text x="477" y="375" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">bavar_style</text>
  <text x="452" y="305" font-size="11" font-weight="bold" fill="#0288d1" text-anchor="middle">15.2%</text>
  <text x="502" y="340" font-size="11" fill="#666" text-anchor="middle">0%</text>
  
  <!-- 4. rc_vov (Verified: 30.3% = 72.7px, Caught: 100% = 240px) -->
  <rect x="570" y="277.3" width="45" height="72.7" fill="#29b6f6" rx="3"/>
  <rect x="620" y="110" width="45" height="240" fill="#43a047" rx="3"/>
  <text x="617" y="375" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">rc_vov (VERITAS)</text>
  <text x="592" y="270" font-size="11" font-weight="bold" fill="#0288d1" text-anchor="middle">30.3%</text>
  <text x="642" y="102" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">100%</text>
  
  <!-- Legend -->
  <rect x="230" y="410" width="18" height="12" fill="#29b6f6" rx="2"/>
  <text x="255" y="421" font-size="12" fill="#444">Verification Rate (% Steps Verified)</text>
  <rect x="480" y="410" width="18" height="12" fill="#43a047" rx="2"/>
  <text x="505" y="421" font-size="12" fill="#444">Error Precision (% Errors Caught)</text>
</svg>