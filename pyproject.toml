[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "veritas"
version = "2.0.0"
description = "Actor-relative evidence value for coding-agent harnesses"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4,<3",
    "transformers>=4.51,<5",
    "accelerate>=1.3,<2",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
data = ["huggingface_hub>=0.34,<2", "pyarrow>=15"]

[project.scripts]
veritas = "veritas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "docker: needs a running Docker daemon and pulled task images",
  "gpu: needs torch, transformers and a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "runs", "literature"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]
