# Requires NEW calibration and validation records collected with current code.
tasks: data/prepared
base_config: configs/experiment.yaml
server:
  backend: ollama
  base_url: http://127.0.0.1:11434
models: ["qwen2.5-coder:7b"]
sources: [gsm8k_train]
split: dev
limit: 20
seed: 42
policies: [never, always, confidence, error_impact, rcvov]
verification_budget: 0.2
overrides:
  gsm8k_train: configs/profiles/math.yaml
calibration:
  gsm8k_train:
    artifact: artifacts/gsm8k-v2.json
    tuning: artifacts/gsm8k-tuning-v2.json
